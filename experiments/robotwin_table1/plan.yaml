  total_full_matrix_rollouts: 30000
  runner_job_retries: 0
  policy_failures: count_as_failure_in_fixed_denominator
  infrastructure_errors: record_error_restore_same_scene_and_block_final_table_until_resolved
  require_exact_scene_instruction_pairing: true
  allow_privileged_evaluation_inputs: false
  allow_random_training_demonstrations_in_primary_study: false
