schema_version: 1
artifact_kind: experiment_plan_not_runner_config
created: '2026-11-24'
status: proposed_not_executed
human_plan: ../../ROBOTWIN_EXPERIMENT_PLAN.txt
objective: Measure frozen Tau0 subtask conditioning on AW-0 Code Expert against paired controls and paper Table
  1.
references:
  table_values: user_supplied_image
  paper: https://arxiv.org/html/2610.30136v1
  current_leaderboard: https://robotwin-platform.github.io/leaderboard
comparison_limits:
- Published table uses 50 rollouts per task and setting; current leaderboard and repository standard default use
  100.
- Original WAM and Hybrid use different downstream demonstration collection pipelines.
- Warm-starting from hybrid.pt is continued adaptation; original downstream exposure remains part of the model history.
- Unknown original paper scene seeds and instruction pool prevent claiming exact episode-level reproduction.
- Tau0 adds a 9B planner and inference cost; matched low-level training budgets do not imply equal inference compute.
routes:
  A_recommended_first:
    initial_checkpoint: /home/yilianli/project/models/agentic-wam-robotwin-release/hybrid.pt
    training_data: 50 clean successful CaP-aligned demos per task; prefer original release data
    tasks: 50
    new_selected_demonstrations: 2500
    cumulative_downstream_exposure: unknown_if_newly_collected; disclose separately
    interpretation: continued adaptation with matched C0/C1; paper values are reference
  B_uniform_data_budget:
    initial_checkpoint: /home/yilianli/project/models/agentic-wam-pretrain/agenticwam_pretrain.pt
    training_data: same official 2500 clean demos with aligned program labels added
    tasks: 50
    selected_training_demonstrations: 2500
    interpretation: separate data-budget-controlled study; training compute must still be disclosed
