  - helper_libraries
  - perception_versions
  - arbiter_rules
  - step_limits
  - success_checks
  - image_preprocessing
training_suggestion_route_A:
  status: initial_hypothesis_not_validated
  paired_models:
  - C0
  - C1
  seed: 42
  optional_replication_seeds:
  - 43
  - 44
  num_gpus: 2
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 2
  effective_batch_size: 4
  mixed_precision: bf16
  deepspeed_zero_stage: 2
  gradient_checkpointing: true
  learning_rate: 2.0e-05
  weight_decay: 0.01
  scheduler: cosine
  initial_main_steps: 5000
  optional_main_steps_after_development: 15000
  save_every: 1000
  full_model_feasibility_steps: 100
  pilot_steps:
  - 500
  - 1000
  joint_loss_weights:
    video: 1.0
    action: 1.0
    code: 0.5
  max_prompt_plus_code_tokens: 768
  code_canvas: 124
  subtask_max_tokens: 128
  freeze_tau0: true
  freeze_vae: true
  preserve_frozen_vision_tower: true
  stop_planner_during_low_level_training: true
  selection: independent Clean development scenes only; freeze before formal evaluation
  normalization: reuse release 14D stats for warm-start; if changed apply identically to both arms and record hash
  fast_joint_enabled: false
planner:
  model_id: sii-research/tau-0-vla-proposal
  base_architecture: Qwen3.5-9B
  primary_adaptation: none_frozen
  task_type: full_qa
  camera_order:
  - head
  - left
  - right
  offline_stride_frames: 24
  condition_field: subtask
  memory_field: next_memory
  condition_masked: false
  condition_is_ce_target: false
  online_uses_current_policy_observations: true
  allow_demonstration_cache_replay_at_evaluation: false
  forbid_inputs:
  - future_frames
  - future_actions
  - ground_truth_stage
  - ground_truth_object_poses
  - success_oracle
pilot_tasks:
- click_alarmclock
- handover_block
- stack_blocks_two
- open_microwave
- put_object_cabinet
- place_object_scale
- pick_dual_bottles
- stack_bowls_three
metrics:
  clean: arithmetic mean of 50 per-task success rates
  random: arithmetic mean of 50 per-task success rates
  average: (clean + random) / 2
  display_decimals: 1
  difference_unit: percentage_points
  primary_conditioning_comparison: C1-C0
  secondary_conditioning_comparison: C1H-C0H
  execution_comparisons:
  - C0H-C0
  - C1H-C1
  uncertainty: paired bootstrap over tasks for local paired comparisons; not published aggregate values
  required_diagnostics:
  - per_task_success
  - actual_scene_seed
  - actual_instruction
  - policy_failure_type
  - planner_latency_median_p95
  - replan_latency_median_p95
  - episode_latency_median_p95
  - gpu_peak_memory
  - hybrid_code_acceptance
  - hybrid_code_action_fraction
  - wam_fallback_fraction
  final_table_requires:
    all_tasks: 50
    all_settings: 2
    episodes_per_cell: 50
    episodes_per_variant: 5000
    unresolved_errors: 0
    duplicate_scene_records: 0
resource_plan:
  hardware: 2x RTX PRO 5000 Blackwell 48GB; full workload fit/throughput unverified
  training: both GPUs, one model at a time, planner and perception stopped
  wam_evaluation: GPU0 low-level; GPU1 Tau0; one policy worker
  hybrid_evaluation: additional perception GPU/service preferred; two-GPU co-residency requires measured fit and
    fixed settings
  wall_time: estimate from measured full-model steps and representative episode latency, not a fixed promise
known_prerequisites:
- Proposal environment and released 9B weights
- Actual 50-task clean training demonstrations with stage/program alignment
- Text embeddings and causal Tau0 subtask caches
- C0 matched train/evaluation configs
- Complete model training feasibility and online rollout checks
- SAM3 weights/real service verification and Hybrid compute allocation
- Accepted scene/instruction manifest, per-episode error accounting and strict result completeness checker
