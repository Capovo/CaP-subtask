      max_reveal_per_step: 4
  released_wam_parameters:
    num_inference_steps: 20
    code_tokens: 128
    replan_steps: 24
    image_crop: 0.95
    decode:
      confidence_threshold: 0.0
      max_reveal_per_step: 9999
