    training_pair: C0_C1
  - id: C1
    method: CaP-subtask (WAM)
    checkpoint: null
    execution: wam
    extra_training: true
    tau0: true
    evaluation_parameters: controlled
    training_pair: C0_C1
  - id: C0H
